; 노트북 대응: 그림자 방식(VSM/CSM)을 프로젝트 설정이 아니라 그림자 등급이 정한다.
; Low/Medium은 일반 캐스케이드 그림자(CSM), High/Epic은 VSM.
; 게임의 등급은 첫 실행 하드웨어 벤치마크가 정한다(UCSKGameInstance::ApplyFirstRunScalability).
; DefaultEngine.ini에 r.Shadow.Virtual.Enable을 다시 넣으면 안 된다 — 프로젝트 설정이 등급보다
; 우선순위가 높아서 여기 값이 전부 무시된다

[ShadowQuality@0]
r.Shadow.Virtual.Enable=0

[ShadowQuality@1]
r.Shadow.Virtual.Enable=0

[ShadowQuality@2]
r.Shadow.Virtual.Enable=1

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1

[ShadowQuality@Cine]
r.Shadow.Virtual.Enable=1

; 랜드스케이프 그라스(LG_Grass 등) 컬 거리. 밀도는 엔진 기본(grass.DensityScale)이 이미 등급별로 줄인다.
; 등급을 오갈 때 이전 값이 남지 않도록 모든 등급에 적는다

[FoliageQuality@0]
grass.CullDistanceScale=0.5

[FoliageQuality@1]
grass.CullDistanceScale=0.6

[FoliageQuality@2]
grass.CullDistanceScale=0.8

[FoliageQuality@3]
grass.CullDistanceScale=1.0

[FoliageQuality@Cine]
grass.CullDistanceScale=1.0

; 노트북 대응: Lumen(GI·반사)은 Epic/Cine에서만. 엔진 기본은 High부터 켜는데, 밝은 야외 섬이라 비용 대비 이득이 작다.
; High는 엔진 Medium과 같은 경로가 된다 — GI는 스카이라이트+거리장 AO, 반사는 SSR(r.SSR.Quality는 엔진 High 값 유지).
; SSGI 대체는 불가: 엔진은 GI 방식이 ScreenSpace일 때만 SSGI를 돌리는데 프로젝트 GI 방식은 Lumen이다.
; 나머지 등급은 엔진 BaseScalability.ini가 이미 정하므로 High만 덮어쓴다

[GlobalIlluminationQuality@2]
r.Lumen.DiffuseIndirect.Allow=0

[ReflectionQuality@2]
r.Lumen.Reflections.Allow=0
