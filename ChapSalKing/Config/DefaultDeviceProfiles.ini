[DeviceProfiles]
+DeviceProfileNameAndTypes=CSK_Laptop,Windows

[CSK_Laptop DeviceProfile]
DeviceType=Windows
BaseProfileName=Windows

; Keep the project-wide high-end renderer available, while using a lightweight
; runtime preset when the game is launched with: -dp=CSK_Laptop
+CVars=sg.ViewDistanceQuality=1
+CVars=sg.AntiAliasingQuality=2
+CVars=sg.ShadowQuality=1
+CVars=sg.GlobalIlluminationQuality=0
+CVars=sg.ReflectionQuality=0
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=2
+CVars=sg.EffectsQuality=1
+CVars=sg.FoliageQuality=0
+CVars=sg.ShadingQuality=1

+CVars=r.ScreenPercentage=70
+CVars=r.AntiAliasingMethod=2
+CVars=r.Shadow.Virtual.Enable=0
+CVars=r.Lumen.DiffuseIndirect.Allow=0
+CVars=r.Lumen.Reflections.Allow=0
+CVars=grass.DensityScale=0.5
+CVars=foliage.DensityScale=0.5
+CVars=t.MaxFPS=60
